base:
  name: energy-shock-squeeze-without-recession
  band: "50-60%"  # HELD 2026-07-31: two more base-case days (oil back to $88-89 inside range; 3 hawkish holds without a delivered hike - Fed 9-3/BoE 6-3/BOJ 8-1; equities repaired; EZ +0.4%/MY +5.8% growth beats). Composition risk now RATES-led not oil-led: 30Y 5.21% (2007 high) + Sept ~63% is the base case stressing itself internally. Raised 2026-07-30: Brent back INSIDE the $85-105 range ($90.74, +7.9% on the Jordan attack); a hawkish adjustment priced without a delivered hike (9-3 hold, 3 dissents, Sept ~56%); equities chopped lower rather than crashed - Wednesday was near-textbook base case
  restructure_note_2026_07_31: >
    The post-BOJ restructure flagged since 07-28 is SCHEDULED FOR THE MONDAY 2026-08-03 RUN,
    deliberately: the chip axis this board does not span just resolved violently upward
    (Kospi +17.91% record, TAIEX +7.98% record points), and the weekend carries three
    binaries (US response to the Kuwait attack, OPEC+ Sunday, COT ref 28 Jul) that land
    before Monday. Rebuilding architecture at an intraday US cutoff would bake in
    half-session evidence. The 07-31 oil-vs-war divergence (Brent -7% on the widest
    escalation week) also argues the ENERGY axis itself needs re-examination, not just
    a chip axis bolted on.
  coverage_gap_note: >
    Flagged 2026-07-29: none of the three scenarios spans the China chip-competition
    shock (DUV lithography reports + CXMT; Kospi -10.84%, TAIEX -4.65% on 28 Jul),
    which is a different axis from the energy shock this board was built around.
    FOMC has now passed (hold, 3 dissents); restructure after the BOJ (31 Jul) - i.e. the
    Friday or Monday run - rather than improvising mid-week; until then this board remains the ENERGY-scenario board
    and the chip-competition thread is tracked in themes/china.md and themes/earnings.md.
  narrative: >
    Oil trades in a wide $85-105/bbl range on ongoing Red Sea/Middle East risk;
    one hawkish central-bank adjustment (Fed and/or ECB) gets priced without a
    confirmed hike yet; equities chop lower rather than crash; core inflation
    stays contained even as headline/energy prints run hot.
  supporting_evidence:
    - "Brent ~$97-100/bbl intraday on 23 Jul 2026, a confirmed supply-shock catalyst, but no confirmed Hormuz closure."
    - "Eurozone core CPI 2.4% and Malaysia CPI 1.9% (both pre-shock) show cores were contained going in."
  contradicting_evidence:
    - "VIX >19 and a synchronised hawkish repricing across Fed/ECB/BOJ on a single session is a faster move than a calm 'base case' would suggest."
  confirmation_signals:
    - "Flash PMIs (24 Jul) hold up without falling into contraction."
    - "Oil stalls below $100/bbl rather than pushing through."
  invalidation_signals:
    - "A confirmed ceasefire or de-escalation (pushes toward the upside scenario)."
    - "A new chokepoint disruption, e.g. a confirmed Hormuz incident (pushes toward the downside scenario)."
  next_catalysts:
    - "Eurozone and US flash PMIs, 24 Jul"
    - "Japan CPI, 24 Jul"
    - "Fed meeting, next week"
    - "BOJ meeting, 30-31 Jul"
  sensitive_assets: ["energy equities vs. long-duration tech", "USDJPY", "USDMYR"]
  sensitive_sectors: ["energy", "long-duration/AI-capex tech"]

upside:
  name: de-escalation-relief
  band: "10-20%"  # HELD 2026-07-31, composition SWAPPED: diplomatic leg worsened (Iran REJECTED the Omani proposal; open exchange on GCC soil - Kuwait base attack) but the PHYSICAL leg improved (partial Hormuz resumption, Qatar LNG cargo, Brent -7% wk, 14-nation Red Sea coalition) and a Hamas disarmament roadmap appeared (unsigned by Israel). Scenario now rests on de-escalation-by-exhaustion, physics over politics. CUT 2026-07-30: invalidation signal FIRED - the strike pause broke (IRGC ballistic missiles at a US airbase in Jordan; reported US counterattacks on Iranian territory); Brent +7.9% to $90.74; RBC "exceedingly skeptical" of a near-term breakthrough. Kept >0 because the Hormuz process survived (three-route compromise concept; Iran showing "some flexibility" per Al Jazeera)
  narrative: >
    Middle East strikes and Red Sea attacks subside; Brent retraces toward the
    low-$80s; the hawkish hike odds built up on 23 Jul unwind; AI-capex spending
    gets reframed by the market as a growth story again rather than a margin risk.
  supporting_evidence:
    - "No confirmed Hormuz closure to date — the shock so far is a risk premium, which can unwind quickly on a diplomatic headline."
    - "2026-07-25/26: US paused strikes on Iran two consecutive days, Iran matched, Oman-mediated direct talks 'made progress' (AP via NPR 26 Jul); Saudi coalition declared its Houthi response 'over' (ToI 25 Jul). Band raised 10-20% -> 15-25% on these confirmation signals firing."
    - "2026-07-27: pause held a SECOND night; Oman-mediated Hormuz-reopening talks 'making progress'; Brent settled $88.36 (-8.7%, below $90) - the 'Brent <$90' confirmation signal fired; Fed hike odds eased 38% -> ~33-34%; CPC terminal resumed loading. Band raised 15-25% -> 20-30%."
    - "2026-07-28: THIRD confirmation day - Netanyahu-Trump meeting passed without escalation ('ironclad' Iran-nuclear line, no new strikes announced); pause held 3+ nights; Iran-Oman exchanged CONCRETE Hormuz-management proposals (Gulf Malacca-model w/ voluntary fees vs Iran $1m/ship counter); Brent settled $84.09 (-4.8%, worst 3-day run since Apr 2020); hike odds 31.5% at the close. Band raised 20-30% -> 25-35%."
  contradicting_evidence:
    - "2026-07-25: Houthi attack set the Jizan Aramco refinery (400k b/d) ablaze and targeted Yanbu — physical supply damage is now real, not just risk premium."
    - "2026-07-28: Jizan confirmed SHUT since 27 Jul with tentative restart 15 Aug (Reuters/IIR); Yanbu loadings -40%, 14 berths AIS-dark (Windward); IRGC fired warning shots at 6 vessels; Iran deputy FM: 'any action' to retain strait control - the physical/rhetorical floor under the relief trade."
    - "US Navy blockade enforcement continues (2 tankers disabled)."
    - "2026-07-29: INVALIDATION FIRED - IRGC ballistic missiles at a US airbase in Jordan (intercepted); Trump: Iran 'would be hit hard'; Iranian media reported US counterattacks on Iranian territory; Brent settled $90.74 (+7.9%); Houthi missiles at Saudi tanker NCC Ghazal; US sanctioned two Iranian 'safe passage' companies. Band cut 25-35% -> 10-20%."
  confirmation_signals:
    - "Diplomatic/ceasefire headlines from the Middle East."
    - "OVX (oil volatility) collapsing from its elevated ~65 level."
  invalidation_signals:
    - "Any further chokepoint incident."
  next_catalysts:
    - "Any Middle East diplomatic development"
  sensitive_assets: ["Brent/WTI", "gold", "Nasdaq 100"]
  sensitive_sectors: ["energy (downside for exporters)", "long-duration tech (upside)"]

downside:
  name: stagflationary-policy-shock
  band: "20-30%"  # HELD 2026-07-31, teeth sharpened: ECI +0.9% delivered the hot-wage print; Sept ~63% with dissent blocs at Fed/BoE/BOJ; 30Y 5.21%; EZ energy +10% y/y. But missing legs moved AWAY: Brent -7% wk (needs >$100 sustained) and still no delivered hike. If a Sept hike lands on a +1.5% GDP economy with the long end >5.2%, the policy shock arrives via the CURVE not the barrel - Monday restructure to consider renaming the axis. Raised 2026-07-30: re-armed on three fronts - the talks-collapse leg partially fired (Jordan attack broke the pause); a Fed dissent bloc (3 votes) one hot data print from a majority with Sept ~56% priced; physical capacity degrading on BOTH sides (Jizan shut, Ryazan hit, corridor stopped) while 30Y holds >5% a 15th session. Still requires Brent >$100 sustained + an actual hike - neither yet
  narrative: >
    Brent sustains above $100/bbl; the Fed and/or ECB deliver an actual hike
    rather than just pricing one; the UST 10Y pushes toward 5%; tech re-rates
    sharply lower; yen disorder (USDJPY already at 40-year lows) forces a
    BOJ or MOF response.
  supporting_evidence:
    - "UST 10Y already at ~4.70%, highest since Jan 2025, with a CNBC piece explicitly flagging a test of 5% as plausible (23 Jul)."
    - "USDJPY at ~163, weakest yen since 1986, ahead of the 30-31 Jul BOJ meeting."
    - "Fed 2026 hike odds already ~71% per Polymarket (via Yahoo Finance)."
    - "2026-07-29: FOMC held 9-3 with THREE dissents for +25bp (Hammack/Kashkari/Logan) and a hawkish Warsh presser; Sept hike ~56% priced. Long yields ROSE on the hold (10Y ~4.68-4.70%). Brent +7.9% to $90.74 on the Jordan attack. Physical supply degrading on two axes: Jizan shut to ~15 Aug + Ryazan refinery hit (Russian runs lowest since 2005) + Black Sea grain corridor full stop. Band raised 10-20% -> 20-30%."
  contradicting_evidence:
    - "No central bank has actually hiked yet — this scenario requires a step beyond the current pricing, not just a continuation of it."
    - "2026-07-25/26: US-Iran mutual strike pause and progressing talks lean against this scenario; band trimmed 20-30% -> 15-25%. It re-arms fast on a July FOMC hike, a talks collapse, or a hot PCE/ECI/Australia-CPI run."
  confirmation_signals:
    - "A new chokepoint disruption (e.g. a confirmed Hormuz incident)."
    - "A hot Japan or US inflation print."
    - "PMI price sub-indices rising while output/new-orders components fall (a classic stagflation signature)."
  invalidation_signals:
    - "A confirmed de-escalation or a dovish central-bank surprise."
  next_catalysts:
    - "Fed meeting, next week"
    - "BOJ meeting, 30-31 Jul"
    - "Any further Red Sea/Hormuz incident"
  sensitive_assets: ["UST 10Y/30Y", "USDJPY", "Nasdaq 100", "gold"]
  sensitive_sectors: ["long-duration tech", "rate-sensitive financials", "housing"]
